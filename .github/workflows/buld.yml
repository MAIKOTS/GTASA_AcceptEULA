name: Build AcceptEULA (Android .so)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    env:
      ANDROID_NDK_VERSION: '25.2.9519653'   # ajuste se desejar outra versão
      API_LEVEL: '21'                       # mínimo Android API level
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v4
        with:
          ndk: ${{ env.ANDROID_NDK_VERSION }}

      - name: Show Android environment (debug)
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "API_LEVEL=${API_LEVEL}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          echo "NDK_HOME=${NDK_HOME}"
          echo "Contents of ${ANDROID_SDK_ROOT}/ndk (if present):"
          ls -la "${ANDROID_SDK_ROOT:-/dev/null}/ndk" || true
          echo "Contents of ${ANDROID_SDK_ROOT}/cmdline-tools (if present):"
          ls -la "${ANDROID_SDK_ROOT:-/dev/null}/cmdline-tools" || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build

      - name: Configure CMake for Android (${{ matrix.abi }})
        run: |
          # Detect NDK directory (prefer ANDROID_NDK_ROOT/ANDROID_NDK_HOME, fallback to ANDROID_SDK_ROOT/ndk/<version>)
          if [ -n "${ANDROID_NDK_ROOT:-}" ]; then
            NDK_DIR="${ANDROID_NDK_ROOT}"
          elif [ -n "${ANDROID_NDK_HOME:-}" ]; then
            NDK_DIR="${ANDROID_NDK_HOME}"
          elif [ -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" ]; then
            NDK_DIR="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          else
            echo "ERROR: NDK not found. Checked ANDROID_NDK_ROOT, ANDROID_NDK_HOME and ${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            ls -la "${ANDROID_SDK_ROOT}/ndk" || true
            exit 1
          fi

          echo "Using NDK_DIR=${NDK_DIR}"
          TOOLCHAIN_FILE="${NDK_DIR}/build/cmake/android.toolchain.cmake"
          if [ ! -f "${TOOLCHAIN_FILE}" ]; then
            echo "ERROR: toolchain file not found at ${TOOLCHAIN_FILE}"
            ls -la "${NDK_DIR}/build/cmake" || true
            exit 1
          fi

          cmake -S . -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN_FILE}" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${API_LEVEL} \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static

      - name: Build
        run: cmake --build build/${{ matrix.abi }} --config Release -- -j

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcceptEULA -${{ matrix.abi }}
          path: build/${{ matrix.abi }}/**/*.so            -DANDROID_PLATFORM=android-${API_LEVEL} \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_static

      - name: Build
        run: cmake --build build/${{ matrix.abi }} --config Release -- -j

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libFastBoot-${{ matrix.abi }}
          path: build/${{ matrix.abi }}/**/*.so
